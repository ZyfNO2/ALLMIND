<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>AIKI Chat Bridge 配对</title>
<body><h1>AIKI Chat Bridge</h1><p>请在你要使用的 Chrome 配置中登录目标 ChatGPT 账号，再输入 AIKI 模型设置中的本地配对码。扩展只使用本配置的登录态，配对会在此窗口创建一个不抢焦点的专用后台标签。多个 Google 账号不代表多个独立 ChatGPT 登录态；同一 Chrome 配置使用当前 ChatGPT 会话。更换 Chrome 配置需先在 AIKI 重新配对，不会自动换号。</p>
<label>本地配对码 <input id="code" type="password" autocomplete="off" size="68"></label><button id="pair">配对</button><p id="status" role="status"></p><script src="options.js"></script></body></html>
